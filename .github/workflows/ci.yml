name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          # Monorepo: without this, the action looks for pyproject.toml /
          # uv.lock / .python-version at the repo root instead of backend/.
          working-directory: backend
          enable-cache: true

      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run test
      - run: npm run build

      # The production image builds with a subdirectory base path. A wrong or
      # ignored base shows up in the browser as a blank page (the SPA fallback
      # answers missing assets with index.html), so fail here instead.
      - name: Build under the production base path
        env:
          VITE_BASE_PATH: /fantasy-adventure-ai/
        run: |
          npm run build
          grep -q 'src="/fantasy-adventure-ai/assets/' dist/index.html
          grep -q 'href="/fantasy-adventure-ai/favicon.svg"' dist/index.html
