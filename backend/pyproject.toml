[project]
name = "fantasy-adventure-ai-backend"
version = "0.1.0"
description = "FastAPI backend for Fantasy AI Adventure"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.1",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "google-genai>=2.19.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# Alembic's own revision template doesn't follow this project's style
# (Union[...] instead of |, long generated create_table calls); these are
# generated files, not hand-written code.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# B008: FastAPI's Depends()/Query()/etc. are meant to be used as argument
# defaults - that's the framework's own dependency-injection idiom, not a bug.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

