services:
  api:
    build:
      # Task 49 hardened the production Dockerfile's final stage to a slim,
      # non-root image with no uv binary - dev instead builds against the
      # `builder` stage, which still has uv + a writable venv for the
      # `uv sync && uv run --reload` command below.
      target: builder
    volumes:
      # Bind-mount source for live reload, but keep the venv in a named
      # volume so the container's Linux-built virtualenv isn't shadowed by
      # a host-built one (Windows/macOS binaries won't run in the container).
      - ./backend:/app
      - backend_venv:/app/.venv
    command: sh -c "uv sync --locked && uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      # Task 50 removed this from the base file (Caddy fronts the api in
      # production, so it's no longer reachable directly from the host) -
      # dev doesn't run Caddy at all (see Task 9's decision), so restore
      # direct host access here for the documented localhost:8000 workflow.
      - "8000:8000"

  frontend:
    image: node:24-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
      # Docker's bind-mount filesystem doesn't propagate native file-change
      # events into the container - without this, editing files on the host
      # never triggers HMR. See vite.config.ts for details.
      VITE_USE_POLLING: "true"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  backend_venv:
  frontend_node_modules:
