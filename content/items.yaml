    name: Lantern of Late Hours
    category: magic_tool
    rarity: uncommon
    description: A lantern that lights only when someone nearby has unfinished business.
    tags: [magic, light, starting_item]
    effects: [reveal_unfinished_business, light_darkness]

  - id: borrowed_codex
    name: Borrowed Codex of Imperial Procedures
