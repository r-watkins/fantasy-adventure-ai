    effects: [identify_imperial_ritual, cite_procedure]

  - id: ink_stained_gloves
    name: Ink-Stained Gloves
    category: clothing
    rarity: common
    description: Archive gloves with a smudge that moves when nobody is watching.
    tags: [archive, starting_item]
    effects: [handle_fragile_document, recognize_ink_magic]

  - id: archive_key_fragment
    name: Archive Key Fragment
    category: key
    rarity: rare
    description: One-third of a brass key that hums near sealed imperial doors.
