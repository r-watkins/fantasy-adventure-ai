items:
  - id: iron_cook_knife
    name: Iron Cook Knife
    category: weapon_tool
    rarity: common
    description: A well-balanced kitchen knife with a blackened wooden handle.
    tags: [blade, tool, kitchen, starting_item]
    effects: [cut_rope, prepare_food, defend]

  - id: grease_pencil
    name: Grease Pencil
    category: tool
    rarity: common
    description: A thick wax pencil that writes on crockery, stone, and occasionally ghosts.
    tags: [writing, kitchen, starting_item]
    effects: [mark_surface, reveal_heat, leave_message]

  - id: hearth_thistle_apron
    name: Hearth & Thistle Apron
    category: clothing
    rarity: common
    description: A durable apron with too many pockets and one stubborn stew stain.
    tags: [clothing, practical, starting_item]
    effects: [conceal_small_item, identify_kitchen_tool]

  - id: field_sickle
    name: Field Sickle
    category: weapon_tool
    rarity: common
    description: A farmer's curved blade, sharp from honest use.
    tags: [blade, harvest, starting_item]
    effects: [cut_plants, harvest, defend]

  - id: seed_sack
    name: Seed Sack
    category: tool
    rarity: common
    description: Winter wheat seed from a trusted field, unless the field has changed its mind.
    tags: [farming, starting_item]
    effects: [test_soil, lure_birds, mark_path]

  - id: weathered_straw_cloak
    name: Weathered Straw Cloak
    category: clothing
    rarity: common
    description: A patched cloak that smells of rain, hay, and stubbornness.
    tags: [outdoors, starting_item]
    effects: [resist_cold, blend_in_field]

  - id: grave_spade
    name: Grave Spade
    category: weapon_tool
    rarity: common
    description: A square-headed spade, polished by work and solemn occasions.
